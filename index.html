<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick n Cheaper | Everyday Grocery Savings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00875A;
      --primary-dark: #006644;
      --accent: #E52E2E;
      --accent-light: #FFEBEB;
      --bg-dark: #0F172A;
      --bg-light: #F8FAFC;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-light);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header & Navigation */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 72px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-btn {
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s ease;
    }

    .nav-btn:hover {
      background: #C82323;
    }

    /* Hero Section */
    .hero {
      padding: 80px 0 60px;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: white;
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(229, 46, 46, 0.2);
      color: #FF8A8A;
      border: 1px solid rgba(229, 46, 46, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero p {
      font-size: 18px;
      color: #94A3B8;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    .cta-btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 16px 36px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 135, 90, 0.4);
      transition: all 0.2s ease;
    }

    .cta-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    /* Benefits Section */
    .benefits {
      padding: 80px 0;
      background-color: #ffffff;
    }

    .section-heading {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 50px;
    }

    .section-heading span {
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      font-size: 36px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .section-heading p {
      font-size: 16px;
      color: var(--text-muted);
    }

    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .benefit-card {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      transition: all 0.3s ease;
    }

    .benefit-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
      border-color: #CBD5E1;
    }

    .benefit-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .benefit-card h3::before {
      content: "✓";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background-color: rgba(0, 135, 90, 0.1);
      color: var(--primary);
      border-radius: 50%;
      font-size: 14px;
      font-weight: 800;
    }

    .benefit-card p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Social Proof Section */
    .trust {
      padding: 60px 0;
      background: #F1F5F9;
      text-align: center;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .trust-stats {
      display: flex;
      justify-content: center;
      gap: 60px;
      flex-wrap: wrap;
    }

    .stat h4 {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat p {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
    }

    /* FAQ Section */
    .faq {
      padding: 80px 0;
      background: #ffffff;
    }

    .faq-wrapper {
      max-width: 700px;
      margin: 0 auto;
    }

    .faq-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .faq-question {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 20px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .faq-answer {
      padding: 0 20px 20px;
      color: var(--text-muted);
      font-size: 15px;
      display: none;
    }

    .faq-item.active .faq-answer {
      display: block;
    }

    .faq-item.active .faq-question span {
      transform: rotate(45deg);
    }

    /* Final CTA / Form */
    .final-cta {
      padding: 80px 0;
      background: var(--bg-dark);
      color: white;
      text-align: center;
    }

    .cta-box {
      max-width: 500px;
      margin: 0 auto;
      background: #1E293B;
      padding: 40px;
      border-radius: var(--radius);
      border: 1px solid #334155;
    }

    .cta-box h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .cta-box p {
      color: #94A3B8;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    .form-group input {
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0F172A;
      color: white;
      font-size: 15px;
    }

    .form-group button {
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .form-group button:hover {
      background: #C82323;
    }

    /* Footer */
    footer {
      padding: 30px 0;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      background: #0F172A;
      border-top: 1px solid #334155;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 32px; }
      .section-heading h2 { font-size: 28px; }
      .trust-stats { gap: 30px; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="container nav-wrapper">
      <a href="#" class="logo">Pick n <span>Cheaper</span></a>
      <a href="#claim" class="nav-btn">Get Deals</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
